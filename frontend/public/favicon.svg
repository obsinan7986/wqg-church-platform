<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#013E97" />
      <stop offset="100%" stop-color="#082559" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
  </defs>
  <!-- Background with subtle church royal blue rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <circle cx="32" cy="32" r="28" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.4" />
  <!-- Orthodox Cross -->
  <!-- Vertical beam -->
  <rect x="29" y="10" width="6" height="44" rx="2" fill="url(#gold)" />
  <!-- Upper title bar -->
  <rect x="23" y="15" width="18" height="4" rx="1.5" fill="url(#gold)" />
  <!-- Main horizontal beam -->
  <rect x="14" y="24" width="36" height="6" rx="2" fill="url(#gold)" />
  <!-- Lower slanted footrest beam -->
  <line x1="20" y1="46" x2="44" y2="40" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />
  <!-- Center halo / emblem -->
  <circle cx="32" cy="27" r="5.5" stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.9" />
</svg>
